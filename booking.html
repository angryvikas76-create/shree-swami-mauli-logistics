<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Shipment | Shree Swami Mauli Logistics</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef3f8;
}

header{
background:#003366;
color:white;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
font-size:28px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

.banner{
background:linear-gradient(rgba(0,51,102,.85),rgba(0,51,102,.85)),url("https://images.unsplash.com/photo-1519003722824-194d4455a60c?q=80&w=1600&auto=format&fit=crop");
background-size:cover;
background-position:center;
padding:70px 20px;
text-align:center;
color:white;
}

.banner h1{
font-size:42px;
margin-bottom:10px;
}

.banner p{
font-size:20px;
}

.container{
width:90%;
max-width:1100px;
margin:40px auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.section-title{
background:#003366;
color:white;
padding:12px;
border-radius:6px;
margin-bottom:20px;
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

label{
font-weight:bold;
display:block;
margin-bottom:6px;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
margin-bottom:15px;
}

textarea{
height:90px;
resize:none;
}

.next-btn{
margin-top:20px;
background:#ff9800;
color:white;
padding:14px 35px;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

footer{
margin-top:50px;
background:#003366;
color:white;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<header>

<div class="logo">
🚚 Shree Swami Mauli Logistics
</div>

<nav>
<a href="index.html">Home</a>
<a href="booking.html">Book Shipment</a>
<a href="track.html">Track Shipment</a>
</nav>

</header>

<section class="banner">

<h1>Shipment Booking</h1>

<p>Book your shipment quickly and securely.</p>

</section>

<div class="container">

<form id="bookingForm">

<div class="section-title">
👤 Sender Details
</div>

<div class="grid">

<div>

<label>Sender Name</label>

<input
type="text"
id="senderName"
placeholder="Enter Sender Name"
required>

</div>

<div>

<label>Mobile Number</label>

<input
type="tel"
id="senderMobile"
placeholder="Enter Mobile Number"
required>
  <label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email Address"
required>

</div>

</div>

<label>Pickup Address</label>

<textarea
id="pickupAddress"
placeholder="Enter Complete Pickup Address"
required></textarea>

<div class="section-title">
📍 Receiver Details
</div>

<div class="grid">

<div>

<label>Receiver Name</label>

<input
type="text"
id="receiverName"
placeholder="Enter Receiver Name"
required>

</div>

<div>

<label>Receiver Mobile</label>

<input
type="tel"
id="receiverMobile"
placeholder="Enter Mobile Number"
required>

</div>

</div>

<label>Delivery Address</label>

<textarea
id="deliveryAddress"
placeholder="Enter Complete Delivery Address"
required></textarea>
</div>

<div class="grid">

<div>
<label>Parcel Type</label>
<select id="parcelType" required>
<option value="">Select Parcel Type</option>
<option>Documents</option>
<option>Electronics</option>
<option>Industrial Goods</option>
<option>Household Goods</option>
<option>Fragile Goods</option>
<option>Machinery</option>
<option>Other</option>
</select>
</div>

<div>
<label>Number of Boxes</label>
<input
type="number"
id="numberOfBoxes"
placeholder="Enter Number of Boxes"
required>
</div>

<div>
<label>Total Weight (Kg)</label>
<input
type="number"
id="weight"
step="0.01"
placeholder="Enter Weight"
required>
</div>

<div>
<label>Length (cm)</label>
<input
type="number"
id="length"
placeholder="Length"
required>
</div>

<div>
<label>Width (cm)</label>
<input
type="number"
id="width"
placeholder="Width"
required>
</div>

<div>
<label>Height (cm)</label>
<input
type="number"
id="height"
placeholder="Height"
required>
</div>

<div>
<label>Pickup Date</label>
<input type="date" required>
</div>

<div>
<label>Pickup Time</label>
<input type="time" required>
</div>

<div>
<label>Payment Mode</label>
<select id="paymentMode" required>
<option>Cash</option>
<option>UPI</option>
<option>Bank Transfer</option>
<option>Credit Customer</option>
</select>
</div>

</div>

<label>Special Instructions</label>

<textarea placeholder="Write any special instructions..."></textarea>

<button class="next-btn" type="submit">
Book Shipment
</button>

<div id="success"
style="display:none;margin-top:25px;padding:20px;background:#d4edda;color:#155724;border-radius:8px;font-weight:bold;">
</div>

</form>

</div>

<footer>

<h3>Shree Swami Mauli Logistics</h3>

<p>Fast • Safe • Reliable Transport Services</p>

<p>© 2026 All Rights Reserved.</p>

</footer>

<script>

document.getElementById("bookingForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const button = document.querySelector(".next-btn");

    button.disabled = true;
    button.innerHTML = "Booking Shipment...";

    const bookingData = {

        senderName: document.getElementById("senderName").value,

        senderMobile: document.getElementById("senderMobile").value,

        receiverName: document.getElementById("receiverName").value,

        receiverMobile: document.getElementById("receiverMobile").value,

        pickupAddress: document.getElementById("pickupAddress").value,

        deliveryAddress: document.getElementById("deliveryAddress").value,

        email: document.getElementById("email").value,

        parcelType: document.getElementById("parcelType").value,

        numberOfBoxes: Number(document.getElementById("numberOfBoxes").value),

        weight: Number(document.getElementById("weight").value),

        length: Number(document.getElementById("length").value),

        width: Number(document.getElementById("width").value),

        height: Number(document.getElementById("height").value),

        paymentMode: document.getElementById("paymentMode").value

    };

    try {

        const response = await fetch("http://localhost:5000/api/bookings",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(bookingData)

        });

        const result = await response.json();

        if(result.success){

            const msg = document.getElementById("success");

            msg.style.display="block";

            msg.innerHTML=`
                ✅ <b>Booking Successful!</b><br><br>

                Booking ID:
                <b>${result.booking.bookingId}</b><br><br>

                Please save this Booking ID for tracking your shipment.
            `;

            this.reset();

            window.scrollTo({
                top:document.body.scrollHeight,
                behavior:"smooth"
            });

        }else{

            alert(result.message);

        }

    }catch(error){

        alert("Cannot connect to the server. Please try again.");

    }

    button.disabled=false;
    button.innerHTML="Book Shipment";

});

</script>

</body>
</html>
