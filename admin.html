<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shree Swami Mauli Logistics | Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef3f8;
color:#333;
}

/* LOGIN */

.login-page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#003366,#0b4d91);
}

.login-box{
width:400px;
background:#fff;
padding:35px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.login-box h2{
text-align:center;
color:#003366;
margin-bottom:30px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.login-box button{
width:100%;
padding:14px;
background:#ff9800;
border:none;
border-radius:6px;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

.login-box button:hover{
background:#e68900;
}

/* DASHBOARD */

.dashboard{
display:none;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100%;
background:#003366;
color:white;
overflow:auto;
}

.sidebar h2{
padding:25px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.15);
}

.sidebar a{
display:block;
padding:16px 25px;
color:white;
text-decoration:none;
transition:.3s;
}

.sidebar a:hover{
background:#0b4d91;
}

.main{
margin-left:240px;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.header h1{
color:#003366;
}

.logout-btn{
background:#ff9800;
color:white;
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
}

/* CARDS */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.card{

background:white;

padding:25px;

border-radius:10px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

text-align:center;

}

.card h3{

font-size:34px;

color:#003366;

margin-bottom:10px;

}

.card p{

font-size:18px;

color:#555;

}

/* TABLE */

.table-box{

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.table-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

flex-wrap:wrap;

gap:15px;

}

.table-header input{

padding:12px;

width:300px;

border:1px solid #ccc;

border-radius:6px;

}

table{

width:100%;

border-collapse:collapse;

}

thead{

background:#003366;

color:white;

}

th{

padding:14px;

}

td{

padding:14px;

border-bottom:1px solid #eee;

text-align:center;

}

.status{

padding:6px 12px;

border-radius:20px;

font-size:14px;

color:white;

display:inline-block;

}

.pending{

background:#ff9800;

}

.transit{

background:#2196F3;

}

.delivered{

background:#4CAF50;

}

.action-btn{

padding:8px 14px;

border:none;

border-radius:5px;

cursor:pointer;

background:#003366;

color:white;

margin:2px;

}

.action-btn:hover{

background:#0b4d91;

}

@media(max-width:768px){

.sidebar{

position:relative;

width:100%;

height:auto;

}

.main{

margin-left:0;

}

}

</style>

</head>

<body>

<!-- LOGIN PAGE -->

<div class="login-page" id="loginPage">

<div class="login-box">

<h2>🚚 Admin Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<div class="sidebar">

<h2>SSM Logistics</h2>

<a href="#">📊 Dashboard</a>

<a href="#">📦 Bookings</a>

<a href="#">🚚 Tracking</a>

<a href="#">👥 Customers</a>

<a href="#">🧑‍✈️ Drivers</a>

<a href="#">📄 Invoices</a>

<a href="#">📈 Reports</a>

<a href="#" onclick="logout()">🚪 Logout</a>

</div>

<div class="main">

<div class="header">

<h1>Admin Dashboard</h1>

<button
class="logout-btn"
onclick="logout()">
Logout
</button>

</div>

<div class="cards">

<div class="card">

<h3 id="totalBookings">0</h3>

<p>Total Bookings</p>

</div>

<div class="card">

<h3 id="pendingBookings">0</h3>

<p>Pending</p>

</div>

<div class="card">

<h3 id="transitBookings">0</h3>

<p>In Transit</p>

</div>

<div class="card">

<h3 id="deliveredBookings">0</h3>

<p>Delivered</p>

</div>

</div>

<div class="table-box">

<div class="table-header">

<h2>Recent Bookings</h2>

<input
type="text"
id="search"
placeholder="Search Booking ID">

</div>

<table>

<thead>

<tr>

<th>Booking ID</th>

<th>Customer</th>

<th>From</th>

<th>To</th>

<th>Status</th>

<th>Driver</th>

<th>Action</th>

</tr>

</thead>

<tbody id="bookingTable">
  </tbody>

</table>

</div>

</div>

</div>

<script>

const API_URL = "http://localhost:5000/api";

async function login(){

    const username = document.getElementById("username").value.trim();

    const password = document.getElementById("password").value.trim();

    if(username==="" || password===""){

        alert("Please enter username and password.");

        return;

    }

    try{

        const response = await fetch(API_URL+"/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                password
            })

        });

        const result = await response.json();

        if(result.success){

            localStorage.setItem("token",result.token);

            document.getElementById("loginPage").style.display="none";

            document.getElementById("dashboard").style.display="block";

            loadDashboard();

            loadBookings();

        }else{

            alert(result.message);

        }

    }catch(error){

        alert("Unable to connect to server.");

    }

}

async function loadDashboard(){

    try{

        const token=localStorage.getItem("token");

        const response=await fetch(API_URL+"/dashboard",{

            headers:{
                Authorization:"Bearer "+token
            }

        });

        const result=await response.json();

        if(!result.success) return;

        document.getElementById("totalBookings").innerText=result.dashboard.totalBookings;

        document.getElementById("pendingBookings").innerText=result.dashboard.pending;

        document.getElementById("transitBookings").innerText=result.dashboard.inTransit;

        document.getElementById("deliveredBookings").innerText=result.dashboard.delivered;

    }catch(error){

        console.log(error);

    }

}
  async function loadBookings(){

    try{

        const token = localStorage.getItem("token");

        const response = await fetch(
            API_URL + "/dashboard/recent-bookings",
            {
                headers:{
                    Authorization:"Bearer "+token
                }
            }
        );

        const result = await response.json();

        if(!result.success) return;

        let html = "";

        result.bookings.forEach(booking=>{

            let statusClass="pending";

            if(booking.status==="In Transit"){
                statusClass="transit";
            }

            if(booking.status==="Delivered"){
                statusClass="delivered";
            }

            html += `

<tr>

<td>${booking.bookingId}</td>

<td>${booking.senderName}</td>

<td>${booking.pickupAddress}</td>

<td>${booking.deliveryAddress}</td>

<td>

<span class="status ${statusClass}">
${booking.status}
</span>

</td>

<td>

${booking.driverName || "Not Assigned"}

</td>

<td>

<button
class="action-btn"
onclick="assignDriver('${booking.bookingId}')">

Assign Driver

</button>

<button
class="action-btn"
onclick="changeStatus('${booking.bookingId}')">

Update Status

</button>

</td>

</tr>

`;

        });

        document.getElementById("bookingTable").innerHTML = html;

    }catch(error){

        console.log(error);

    }

}

async function assignDriver(bookingId){

    const driverName = prompt("Driver Name");

    if(!driverName) return;

    const driverMobile = prompt("Driver Mobile");

    if(!driverMobile) return;

    const token = localStorage.getItem("token");

    try{

        const response = await fetch(

            API_URL + "/bookings/" + bookingId + "/driver",

            {

                method:"PATCH",

                headers:{

                    "Content-Type":"application/json",

                    Authorization:"Bearer "+token

                },

                body:JSON.stringify({

                    driverName,
                    driverMobile

                })

            }

        );

        const result = await response.json();

        alert(result.message);

        loadBookings();

    }catch(error){

        alert("Unable to assign driver.");

    }

}

async function changeStatus(bookingId){

    const status = prompt("Enter Status:\nPending\nIn Transit\nDelivered");

    if(!status) return;

    const token = localStorage.getItem("token");

    try{

        const response = await fetch(

            API_URL + "/bookings/" + bookingId + "/status",

            {

                method:"PATCH",

                headers:{

                    "Content-Type":"application/json",

                    Authorization:"Bearer "+token

                },

                body:JSON.stringify({

                    status

                })

            }

        );

        const result = await response.json();

        alert(result.message);

        loadBookings();

        loadDashboard();

    }catch(error){

        alert("Unable to update status.");

    }

}
document.getElementById("search").addEventListener("keyup",function(){

    const value=this.value.toLowerCase();

    const rows=document.querySelectorAll("#bookingTable tr");

    rows.forEach(row=>{

        if(row.innerText.toLowerCase().includes(value)){

            row.style.display="";

        }else{

            row.style.display="none";

        }

    });

});

function logout(){

    localStorage.removeItem("token");

    document.getElementById("dashboard").style.display="none";

    document.getElementById("loginPage").style.display="flex";

}

window.onload=function(){

    const token=localStorage.getItem("token");

    if(token){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("dashboard").style.display="block";

        loadDashboard();

        loadBookings();

    }

};

</script>

</body>

</html>
